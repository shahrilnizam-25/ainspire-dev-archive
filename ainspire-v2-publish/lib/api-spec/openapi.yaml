openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: classify
    description: AI readiness classification
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /classify:
    post:
      operationId: classifyPersona
      tags: [classify]
      summary: Classify AI readiness using the TM AI Gateway
      description: Scores the structured assessment and returns readiness, persona, development, and project-fit signals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClassifyRequest"
      responses:
        "200":
          description: AI classification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClassifyResponse"
        "400":
          description: Invalid request body
        "500":
          description: AI classification error
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AnswerItem:
      type: object
      properties:
        questionId:
          type: string
        questionText:
          type: string
        dimension:
          type: string
        selectedOption:
          type: string
        selectedText:
          type: string
        score:
          type: number
          minimum: 1
          maximum: 4
      required:
        - questionId
        - questionText
        - dimension
        - selectedOption
        - selectedText
        - score
    ClassifyRequest:
      type: object
      properties:
        assessmentVersion:
          type: string
        department:
          type: string
        role:
          type: string
        lang:
          type: string
        answers:
          type: array
          items:
            $ref: "#/components/schemas/AnswerItem"
      required:
        - assessmentVersion
        - department
        - role
        - answers
    Recommendation:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        videoTitle:
          type: string
        relevanceStatement:
          type: string
        videoUrl:
          type: string
          format: uri
        thumbnailUrl:
          type: string
          format: uri
        channelTitle:
          type: string
        duration:
          type: string
      required:
        - title
        - description
    ClassifyResponse:
      type: object
      properties:
        persona:
          type: string
          enum: [explorer, builder, strategist, visionary]
        confidence:
          type: number
          minimum: 0
          maximum: 1
        reasoning:
          type: string
        narrative:
          type: string
        recommendations:
          type: array
          items:
            $ref: "#/components/schemas/Recommendation"
        assessmentVersion:
          type: string
        department:
          type: string
        role:
          type: string
        overallReadiness:
          type: number
          minimum: 0
          maximum: 100
        dimensionScores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        personaScores:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
        strengths:
          type: array
          items:
            type: string
        developmentGaps:
          type: array
          items:
            type: string
        projectFit:
          type: array
          items:
            type: string
        resourceAssignmentSignals:
          type: array
          items:
            type: string
      required:
        - persona
        - confidence
        - reasoning
        - narrative
        - recommendations
