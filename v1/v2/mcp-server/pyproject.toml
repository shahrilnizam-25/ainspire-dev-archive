[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "ainspire-learning-mcp"
version = "0.1.0"
description = "FastMCP tools for AiNspire learning paths and video discovery"
requires-python = ">=3.11"
dependencies = ["fastmcp>=4.1,<5", "httpx>=0.28,<1"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[project.scripts]
ainspire-learning-mcp = "ainspire_mcp.server:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
