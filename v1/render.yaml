services:
  - type: web
    name: ainspire-api
    runtime: node
    buildCommand: npx --yes pnpm@11.20.0 install --frozen-lockfile && cd artifacts/api-server && node build.mjs
    startCommand: node --enable-source-maps artifacts/api-server/dist/index.mjs
    envVars:
      - key: PORT
        value: 10000
      - key: TM_APIGATE_CLIENT_ID
        sync: false
      - key: TM_APIGATE_CLIENT_SECRET
        sync: false
      - key: TM_APIGATE_CHAT_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: YOUTUBE_API_KEY
        sync: false
      - key: YOUTUBE_API_KEY_BACKUP
        sync: false
